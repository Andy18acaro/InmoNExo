<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>InmoNExo — Market Intelligence Lima</title>
  <style>
    :root {
      --bg: #0f1419;
      --card: #1a2332;
      --text: #e7ecf3;
      --muted: #8b9cb3;
      --accent: #3dd68c;
      --border: #2a3544;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    header {
      padding: 1.5rem 2rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }
    h1 { margin: 0; font-size: 1.4rem; }
    h1 span { color: var(--accent); }
    .sub { color: var(--muted); font-size: 0.9rem; }
    main { padding: 1.5rem 2rem 3rem; max-width: 1200px; margin: 0 auto; }
    .metrics {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }
    .metric {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1rem 1.2rem;
    }
    .metric label { display: block; color: var(--muted); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.04em; }
    .metric strong { font-size: 1.6rem; font-weight: 600; }
    section h2 { font-size: 1rem; margin: 0 0 1rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
    table {
      width: 100%;
      border-collapse: collapse;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      font-size: 0.88rem;
    }
    th, td { padding: 0.65rem 0.85rem; text-align: left; border-bottom: 1px solid var(--border); }
    th { background: #121a24; color: var(--muted); font-weight: 600; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #1f2a3a; }
    .filters { display: flex; gap: 0.75rem; margin-bottom: 1rem; flex-wrap: wrap; }
    input, select {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.5rem 0.75rem;
      border-radius: 8px;
      font-size: 0.9rem;
    }
    input { min-width: 220px; }
    .pill {
      display: inline-block;
      padding: 0.15rem 0.5rem;
      border-radius: 999px;
      font-size: 0.72rem;
      background: #243044;
      color: var(--accent);
    }
    .price { font-variant-numeric: tabular-nums; }
    .empty { color: var(--muted); }
    a { color: var(--accent); }
    footer { text-align: center; padding: 2rem; color: var(--muted); font-size: 0.8rem; }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Inmo<span>NExo</span></h1>
      <div class="sub">Inteligencia de mercado — 5 developers Lima</div>
    </div>
    <div class="sub" id="freshness">Cargando…</div>
  </header>
  <main>
    <div class="metrics" id="metrics"></div>

    <section style="margin-bottom: 2rem;">
      <h2>Por distrito</h2>
      <table>
        <thead>
          <tr><th>Distrito</th><th>Proyectos</th><th>Developers</th><th>Precio min</th><th>Precio max</th></tr>
        </thead>
        <tbody id="districts"></tbody>
      </table>
    </section>

    <section>
      <h2>Explorador de proyectos</h2>
      <div class="filters">
        <input type="search" id="search" placeholder="Buscar proyecto o developer…" />
        <select id="districtFilter"><option value="">Todos los distritos</option></select>
        <select id="statusFilter"><option value="">Todos los estados</option></select>
      </div>
      <table>
        <thead>
          <tr>
            <th>Proyecto</th>
            <th>Developer</th>
            <th>Distrito</th>
            <th>Estado</th>
            <th>Desde</th>
          </tr>
        </thead>
        <tbody id="projects"></tbody>
      </table>
    </section>
  </main>
  <footer>Datos públicos · No marketplace · <a href="/docs">OpenAPI</a></footer>

  <script>
    const fmtMoney = (n, cur) => n == null ? "—" : `${cur || "PEN"} ${n.toLocaleString("es-PE")}`;

    async function load() {
      const [overview, districts, projects] = await Promise.all([
        fetch("/analytics/overview").then(r => r.json()),
        fetch("/analytics/districts").then(r => r.json()),
        fetch("/projects").then(r => r.json()),
      ]);

      document.getElementById("freshness").textContent = overview.last_scrape_at
        ? `Último scrape: ${new Date(overview.last_scrape_at).toLocaleString("es-PE")} (${overview.last_scrape_status})`
        : "Sin scrapes registrados";

      document.getElementById("metrics").innerHTML = [
        ["Developers", overview.company_count],
        ["Proyectos", overview.project_count],
        ["Con precio", overview.projects_with_price],
        ["Distritos", overview.district_count],
        ["Eventos", overview.event_count],
      ].map(([label, val]) => `<div class="metric"><label>${label}</label><strong>${val}</strong></div>`).join("");

      document.getElementById("districts").innerHTML = districts.map(d => `
        <tr>
          <td>${d.district}</td>
          <td>${d.project_count}</td>
          <td>${d.company_count}</td>
          <td class="price">${fmtMoney(d.min_price, "S/")}</td>
          <td class="price">${fmtMoney(d.max_price, "S/")}</td>
        </tr>`).join("");

      const districtSelect = document.getElementById("districtFilter");
      [...new Set(projects.map(p => p.district).filter(Boolean))].sort().forEach(d => {
        const o = document.createElement("option");
        o.value = d; o.textContent = d;
        districtSelect.appendChild(o);
      });

      const statusSelect = document.getElementById("statusFilter");
      [...new Set(projects.map(p => p.project_status))].sort().forEach(s => {
        const o = document.createElement("option");
        o.value = s; o.textContent = s;
        statusSelect.appendChild(o);
      });

      const render = () => {
        const q = document.getElementById("search").value.toLowerCase();
        const dist = document.getElementById("districtFilter").value;
        const status = document.getElementById("statusFilter").value;
        const rows = projects.filter(p =>
          (!dist || p.district === dist) &&
          (!status || p.project_status === status) &&
          (!q || `${p.project_name} ${p.company_name} ${p.district || ""}`.toLowerCase().includes(q))
        );
        document.getElementById("projects").innerHTML = rows.length ? rows.map(p => `
          <tr>
            <td><a href="${p.project_url || p.source_url}" target="_blank" rel="noopener">${p.project_name}</a></td>
            <td>${p.company_name}</td>
            <td>${p.district || "—"}</td>
            <td><span class="pill">${p.project_status}</span></td>
            <td class="price">${fmtMoney(p.price_min, p.currency === "PEN" ? "S/" : p.currency)}</td>
          </tr>`).join("") : `<tr><td colspan="5" class="empty">Sin resultados</td></tr>`;
      };

      document.getElementById("search").oninput = render;
      document.getElementById("districtFilter").onchange = render;
      document.getElementById("statusFilter").onchange = render;
      render();
    }

    load().catch(err => {
      document.getElementById("freshness").textContent = "Error cargando datos — ¿corriste seed_demo?";
      console.error(err);
    });
  </script>
</body>
</html>
